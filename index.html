<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MAX's CREDITS  ·  v1.3.0</title>
<style>
/* ============================================================
   MAX's CREDITS  ·  超级马里奥风（非像素 · 仅大数字像素化）
   ============================================================ */
:root{
  /* 马里奥调色板 */
  --mario-red:#E52521;
  --mario-blue:#049CD8;
  --mario-yellow:#FBD000;
  --mario-green:#43B047;
  --mario-brown:#3A2E1F;
  --mario-sky:#7EC8F2;
  --mario-sky-light:#BFE9FB;
  --mario-cream:#FFFDF5;
  --mario-cream-2:#FFF4DD;
  --mario-cream-3:#F5E6C8;

  /* 保留变量名（JS inline style 引用） */
  --bg-0:#7EC8F2;
  --bg-1:#FFFDF5;
  --bg-2:#FFF4DD;
  --bg-3:#F5E6C8;
  --line:#3A2E1F;
  --line-2:#5A4A36;
  --text:#2B2118;
  --text-2:#6B5B47;
  --text-3:#9A8270;
  --primary:var(--mario-red);
  --primary-dim:#FF6B5E;
  --accent:var(--mario-yellow);
  --accent-2:var(--mario-green);
  --danger:#C1121F;
  --info:var(--mario-blue);
  --purple:#9B5DE5;
  --pink:#FF5DA2;

  --shadow-1: 3px 3px 0 var(--mario-brown);
  --shadow-2: 5px 5px 0 var(--mario-brown);
  --shadow-3: 8px 8px 0 var(--mario-brown);
  --shadow-hover: 1px 1px 0 var(--mario-brown);
  --border:4px solid var(--mario-brown);
  --border-thin:3px solid var(--mario-brown);
  --radius:14px;
  --radius-sm:10px;

  --pixel-font:'Courier New', ui-monospace, 'SFMono-Regular', monospace;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,sans-serif;
  background:linear-gradient(180deg, var(--mario-sky) 0%, var(--mario-sky-light) 60%, #E8F7C9 100%);
  color:var(--text);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  font-weight:700;
  letter-spacing:0.01em;
  position:relative;
  min-height:100vh;
}

/* 矢量云朵 + 砖块装饰（圆润，非像素） */
body::before{
  content:'';
  position:fixed;inset:0;
  pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle at 12% 14%, #ffffff 0 26px, transparent 27px),
    radial-gradient(circle at 18% 16%, #ffffff 0 20px, transparent 21px),
    radial-gradient(circle at 8% 18%, #ffffff 0 18px, transparent 19px),
    radial-gradient(circle at 72% 9%, #ffffff 0 30px, transparent 31px),
    radial-gradient(circle at 78% 11%, #ffffff 0 22px, transparent 23px),
    radial-gradient(circle at 66% 12%, #ffffff 0 20px, transparent 21px),
    radial-gradient(circle at 40% 22%, #ffffff 0 22px, transparent 23px),
    radial-gradient(circle at 45% 24%, #ffffff 0 16px, transparent 17px);
  opacity:0.9;
}
/* 底部草地 + 砖块条 */
body::after{
  content:'';
  position:fixed;left:0;right:0;bottom:0;height:120px;
  pointer-events:none;z-index:0;
  background:
    repeating-linear-gradient(90deg,
      var(--mario-green) 0 60px,
      #3a9d3e 60px 62px),
    linear-gradient(180deg, transparent 0 40px, rgba(0,0,0,0) 40px);
  -webkit-mask-image:linear-gradient(180deg, transparent 0 40px, #000 40px);
  mask-image:linear-gradient(180deg, transparent 0 40px, #000 40px);
  opacity:0.25;
}

#app{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;}

/* ============================================================
   顶栏
   ============================================================ */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;
  background:var(--mario-red);
  border-bottom:var(--border);
  position:sticky;top:0;z-index:50;
  box-shadow:0 4px 0 rgba(0,0,0,0.15);
}
.brand{
  display:flex;align-items:center;gap:10px;
  font-size:18px;font-weight:900;letter-spacing:0.04em;
  text-transform:uppercase;color:#fff;
}
.brand-mark{
  width:36px;height:36px;
  background:var(--mario-yellow);
  border:var(--border-thin);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
  box-shadow:var(--shadow-1);
  transform:rotate(-6deg);
}
.brand-mark span{transform:rotate(6deg);display:block;}
.brand-text{color:#fff;text-shadow:2px 2px 0 var(--mario-brown);}
.brand-text em{color:var(--mario-yellow);font-style:normal;}

.view-toggle{
  display:flex;border:var(--border-thin);
  background:var(--mario-cream);border-radius:999px;overflow:hidden;
}
.view-btn{
  padding:8px 16px;font-size:11px;font-weight:900;letter-spacing:0.08em;
  background:transparent;color:var(--text-2);
  border:none;cursor:pointer;text-transform:uppercase;
  border-right:var(--border-thin);
  transition:all .15s;
}
.view-btn:last-child{border-right:none;}
.view-btn.active{background:var(--mario-yellow);color:var(--mario-brown);}
.view-btn:not(.active):hover{background:var(--mario-cream-2);color:var(--text);}

.topbar-right{display:flex;align-items:center;gap:10px;}
.tag{
  padding:5px 12px;font-size:10px;font-weight:900;letter-spacing:0.1em;
  border:var(--border-thin);background:var(--mario-cream);
  border-radius:999px;text-transform:uppercase;color:var(--mario-brown);
}
.tag-red{color:#fff;background:var(--mario-brown);}
.tag-yellow{color:var(--mario-brown);background:var(--mario-yellow);}

/* ============================================================
   余额大卡片
   ============================================================ */
.balance-wrap{padding:24px 20px 12px;}
.balance{
  background:var(--mario-cream);
  border:var(--border);
  box-shadow:var(--shadow-3);
  border-radius:var(--radius);
  padding:24px;
  position:relative;overflow:hidden;
}
.balance::before{
  content:'';position:absolute;top:-20px;right:-20px;
  width:120px;height:120px;
  background:radial-gradient(circle at 50% 35%, var(--mario-yellow) 0 38%, #e0b400 38% 42%, transparent 43%),
             radial-gradient(circle at 35% 65%, var(--mario-red) 0 10px, transparent 11px),
             radial-gradient(circle at 65% 65%, var(--mario-red) 0 10px, transparent 11px);
  transform:rotate(12deg);
  opacity:0.9;
}
.balance::after{
  content:'';position:absolute;bottom:-24px;left:-24px;
  width:90px;height:90px;
  background:var(--mario-green);
  border-radius:50%;
  border:var(--border-thin);
  opacity:0.5;
}
.balance-grid{
  display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:end;
  position:relative;z-index:2;
}
.balance-label{
  font-size:11px;font-weight:900;letter-spacing:0.18em;
  color:var(--text-3);text-transform:uppercase;margin-bottom:8px;
}
/* 大号像素数字 */
.balance-num{
  display:flex;align-items:baseline;gap:10px;
  font-variant-numeric:tabular-nums;
  letter-spacing:0;
}
.balance-num .unit{
  font-size:22px;font-weight:900;color:var(--mario-red);
  text-shadow:2px 2px 0 var(--mario-brown);
}
.balance-num .num{
  font-family:var(--pixel-font);
  font-size:74px;font-weight:900;line-height:0.9;
  color:var(--mario-yellow);
  -webkit-text-stroke:4px var(--mario-brown);
  text-shadow:5px 5px 0 var(--mario-brown);
  letter-spacing:2px;
}
.balance-num .num.flip{animation:numFlip .4s ease;}
@keyframes numFlip{
  0%{transform:translateY(-100%);opacity:0;}
  100%{transform:translateY(0);opacity:1;}
}

.balance-stats{
  display:flex;flex-direction:column;gap:8px;align-items:flex-end;
  position:relative;z-index:2;
}
.stat-pill{
  display:flex;align-items:center;gap:8px;
  padding:7px 12px;
  background:var(--mario-cream-2);
  border:var(--border-thin);
  border-radius:999px;
  font-size:11px;font-weight:900;letter-spacing:0.05em;color:var(--text);
}
.stat-pill .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--mario-brown);}
.stat-pill.in .dot{background:var(--mario-green);}
.stat-pill.out .dot{background:var(--mario-red);}
.stat-pill.warn .dot{background:var(--mario-yellow);}

.expire-bar{margin-top:18px;position:relative;z-index:2;}
.expire-bar-label{
  display:flex;justify-content:space-between;
  font-size:10px;font-weight:900;letter-spacing:0.1em;
  color:var(--text-2);text-transform:uppercase;margin-bottom:6px;
}
.expire-bar-track{
  height:18px;background:var(--mario-cream-3);
  border:var(--border-thin);border-radius:999px;
  position:relative;overflow:hidden;
}
.expire-bar-fill{
  position:absolute;top:0;left:0;height:100%;
  background:repeating-linear-gradient(45deg, var(--mario-yellow) 0, var(--mario-yellow) 10px, var(--mario-red) 10px, var(--mario-red) 20px);
  transition:width .6s cubic-bezier(.2,.8,.2,1);
}

/* ============================================================
   Tab 导航
   ============================================================ */
.tabs{
  display:flex;
  margin:18px 20px 0;
  border:var(--border);border-radius:var(--radius);
  background:var(--mario-cream);
  box-shadow:var(--shadow-1);
  overflow:hidden;
}
.tab{
  flex:1;
  padding:14px 8px;
  text-align:center;
  font-size:11px;font-weight:900;letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--text-2);
  cursor:pointer;
  border-right:var(--border-thin);
  transition:all .15s;
  position:relative;background:transparent;
}
.tab:last-child{border-right:none;}
.tab.active{background:var(--mario-blue);color:#fff;text-shadow:2px 2px 0 var(--mario-brown);}
.tab:not(.active):hover{background:var(--mario-cream-2);color:var(--text);}
.tab .icon{display:block;font-size:20px;margin-bottom:4px;}

/* ============================================================
   内容区
   ============================================================ */
.content{padding:18px 20px 110px;flex:1;}
.view{display:none;}
.view.active{display:block;animation:viewIn .3s ease;}
@keyframes viewIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ============================================================
   通用卡片
   ============================================================ */
.card{
  background:var(--mario-cream);
  border:var(--border);
  box-shadow:var(--shadow-2);
  border-radius:var(--radius);
  margin-bottom:16px;
  position:relative;overflow:hidden;
}
.card-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;
  background:var(--mario-cream-2);
  border-bottom:var(--border-thin);
}
.card-title{
  font-size:13px;font-weight:900;letter-spacing:0.06em;
  text-transform:uppercase;display:flex;align-items:center;gap:8px;color:var(--mario-brown);
}
.card-title .dot{width:12px;height:12px;background:var(--mario-red);border-radius:3px;border:2px solid var(--mario-brown);}
.card-title.green .dot{background:var(--mario-green);}
.card-title.yellow .dot{background:var(--mario-yellow);}
.card-title.blue .dot{background:var(--mario-blue);}
.card-body{padding:16px 18px;}

/* ============================================================
   任务项
   ============================================================ */
.task-list{display:flex;flex-direction:column;gap:10px;}
.task{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;
  background:var(--mario-cream-2);
  border:var(--border-thin);border-radius:var(--radius-sm);
  cursor:pointer;
  transition:all .12s;
  position:relative;
}
.task:hover{transform:translate(-2px,-2px);box-shadow:var(--shadow-1);}
.task:active{transform:translate(0,0);box-shadow:none;}
.task.done{background:var(--mario-yellow);border-color:var(--mario-brown);}
.task.done .task-text{text-decoration:line-through;}
.task-emoji{
  width:44px;height:44px;
  background:var(--mario-cream);
  border:var(--border-thin);border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;
}
.task.done .task-emoji{background:#fff;}
.task-body{flex:1;min-width:0;}
.task-type{
  font-size:9px;font-weight:900;letter-spacing:0.15em;
  color:var(--text-3);text-transform:uppercase;margin-bottom:2px;
}
.task.done .task-type{color:rgba(58,46,31,0.6);}
.task-text{font-size:13px;font-weight:800;line-height:1.3;word-break:break-word;}
.task-val{
  font-size:15px;font-weight:900;
  padding:7px 12px;
  background:var(--mario-cream);
  border:var(--border-thin);border-radius:999px;
  font-variant-numeric:tabular-nums;flex-shrink:0;
}
.task-val.pos{color:var(--mario-green);}
.task-val.neg{color:var(--mario-red);}
.task.done .task-val{background:#fff;color:var(--mario-brown);}

.task-group-label{
  font-size:10px;font-weight:900;letter-spacing:0.2em;
  color:var(--mario-brown);text-transform:uppercase;
  padding:14px 0 8px;
  display:flex;align-items:center;gap:8px;
}
.task-group-label::before{content:'';display:block;width:18px;height:6px;background:var(--mario-red);border-radius:3px;}

/* ============================================================
   奖励商店
   ============================================================ */
.reward-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.reward{
  background:var(--mario-cream-2);
  border:var(--border-thin);border-radius:var(--radius-sm);
  padding:14px 12px;
  cursor:pointer;position:relative;
  transition:all .12s;
  display:flex;flex-direction:column;min-height:140px;
}
.reward:hover{transform:translate(-2px,-2px);box-shadow:var(--shadow-1);}
.reward:active{transform:translate(0,0);box-shadow:none;}
.reward.disabled{opacity:0.45;cursor:not-allowed;filter:grayscale(0.6);}
.reward.disabled:hover{transform:none;box-shadow:none;}
.reward-emoji{font-size:34px;margin-bottom:6px;line-height:1;}
.reward-name{font-size:12px;font-weight:900;margin-bottom:6px;line-height:1.2;flex:1;}
.reward-cost{
  display:flex;align-items:baseline;gap:4px;
  font-weight:900;font-size:18px;
  color:var(--mario-red);
  font-variant-numeric:tabular-nums;
}
.reward-cost .c{font-size:11px;color:var(--text-3);font-weight:900;}
.reward-tag{
  position:absolute;top:8px;right:8px;
  font-size:9px;font-weight:900;letter-spacing:0.1em;
  padding:3px 7px;background:var(--mario-red);color:#fff;
  border:2px solid var(--mario-brown);border-radius:6px;
  text-transform:uppercase;
}
.reward-cat{margin-bottom:16px;}
.reward-cat-label{
  font-size:10px;font-weight:900;letter-spacing:0.2em;
  color:var(--mario-brown);text-transform:uppercase;
  padding:14px 0 8px;display:flex;align-items:center;gap:8px;
}
.reward-cat-label::before{content:'';display:block;width:18px;height:6px;background:var(--mario-yellow);border-radius:3px;}

/* ============================================================
   兑换记录
   ============================================================ */
.record{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;
  background:var(--mario-cream-2);
  border:var(--border-thin);border-radius:var(--radius-sm);
  margin-bottom:8px;
}
.record-dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--mario-brown);flex-shrink:0;}
.record-dot.in{background:var(--mario-green);}
.record-dot.out{background:var(--mario-red);}
.record-body{flex:1;min-width:0;}
.record-title{font-size:13px;font-weight:900;margin-bottom:2px;}
.record-meta{font-size:10px;color:var(--text-3);font-weight:800;letter-spacing:0.05em;}
.record-val{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;}
.record-val.in{color:var(--mario-green);}
.record-val.out{color:var(--mario-red);}
.empty{text-align:center;padding:40px 20px;color:var(--text-3);font-size:13px;font-weight:800;}

/* ============================================================
   爸妈控制台
   ============================================================ */
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.admin-tile{
  background:var(--mario-cream-2);
  border:var(--border-thin);border-radius:var(--radius-sm);
  padding:16px;position:relative;
}
.admin-tile .label{font-size:10px;font-weight:900;letter-spacing:0.15em;color:var(--text-3);text-transform:uppercase;margin-bottom:8px;}
.admin-tile .val{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--mario-brown);}
.admin-tile .val.green{color:var(--mario-green);}
.admin-tile .val.red{color:var(--mario-red);}
.admin-tile .val.yellow{color:#c79a00;}

.admin-actions{display:flex;flex-direction:column;gap:10px;}
.btn{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;
  background:var(--mario-cream-2);
  border:var(--border-thin);border-radius:var(--radius-sm);
  font-size:12px;font-weight:900;letter-spacing:0.06em;
  text-transform:uppercase;cursor:pointer;color:var(--mario-brown);
  transition:all .12s;
}
.btn:hover{transform:translate(-2px,-2px);box-shadow:var(--shadow-1);}
.btn:active{transform:translate(0,0);box-shadow:none;}
.btn.primary{background:var(--mario-red);color:#fff;border-color:var(--mario-brown);}
.btn.danger{background:var(--mario-red);color:#fff;border-color:var(--mario-brown);}
.btn.warn{background:var(--mario-yellow);color:var(--mario-brown);border-color:var(--mario-brown);}
.btn .arrow{font-size:16px;}

.setting-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:var(--border-thin);}
.setting-row:last-child{border-bottom:none;}
.setting-label{font-size:12px;font-weight:900;letter-spacing:0.04em;color:var(--mario-brown);}
.setting-desc{font-size:10px;color:var(--text-3);font-weight:800;margin-top:2px;letter-spacing:0.04em;}
.setting-input{
  background:var(--mario-cream);border:var(--border-thin);border-radius:8px;
  color:var(--text);padding:9px 10px;
  font-size:15px;font-weight:900;width:84px;text-align:right;
  font-family:inherit;font-variant-numeric:tabular-nums;
}
.setting-input:focus{outline:none;background:#fff;}
.toggle{
  width:52px;height:28px;
  background:var(--mario-cream-3);
  border:var(--border-thin);border-radius:999px;
  position:relative;cursor:pointer;transition:background .15s;
}
.toggle::after{
  content:'';position:absolute;top:2px;left:2px;
  width:20px;height:20px;background:var(--text-3);border-radius:50%;
  border:2px solid var(--mario-brown);transition:all .15s;
}
.toggle.on{background:var(--mario-green);}
.toggle.on::after{left:26px;background:#fff;}

/* ============================================================
   模态框
   ============================================================ */
.modal-mask{
  position:fixed;inset:0;z-index:100;
  background:rgba(43,33,24,0.55);
  display:none;align-items:flex-end;justify-content:center;
}
.modal-mask.show{display:flex;animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{
  width:100%;max-width:480px;
  background:var(--mario-cream);
  border-top:var(--border);
  box-shadow:0 -8px 0 var(--mario-brown);
  border-radius:24px 24px 0 0;
  padding:24px 20px;position:relative;
  animation:slideUp .3s cubic-bezier(.2,.8,.2,1);
}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal-handle{width:48px;height:6px;background:var(--mario-cream-3);border-radius:3px;margin:0 auto 16px;}
.modal-title{font-size:19px;font-weight:900;letter-spacing:0.03em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:10px;color:var(--mario-brown);}
.modal-sub{font-size:12px;color:var(--text-2);font-weight:800;margin-bottom:20px;line-height:1.6;}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.modal-actions .btn{flex:1;justify-content:center;border-radius:var(--radius-sm);}
.confirm-emoji{
  font-size:60px;text-align:center;margin:8px 0 16px;
  animation:pop .4s cubic-bezier(.2,1.5,.4,1);
}
@keyframes pop{0%{transform:scale(0) rotate(-180deg);}100%{transform:scale(1) rotate(0);}}

/* ============================================================
   粒子动效（金币/星星/蘑菇）
   ============================================================ */
.particle-layer{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden;}
.particle{
  position:absolute;width:14px;height:14px;
  font-size:18px;line-height:1;
  animation:particleUp 1.3s ease-out forwards;
}
@keyframes particleUp{
  0%{transform:translate(0,0) rotate(0deg) scale(0.4);opacity:1;}
  100%{transform:translate(var(--dx),var(--dy)) rotate(540deg) scale(1.2);opacity:0;}
}

/* ============================================================
   Toast
   ============================================================ */
.toast-layer{position:fixed;top:84px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast{
  background:var(--mario-cream);color:var(--mario-brown);
  border:var(--border-thin);border-radius:999px;
  padding:11px 20px;font-size:12px;font-weight:900;letter-spacing:0.04em;
  box-shadow:var(--shadow-1);
  animation:toastIn .3s ease,toastOut .3s ease 1.7s forwards;
}
.toast.error{background:var(--mario-red);color:#fff;}
.toast.success{background:var(--mario-green);color:#fff;}
@keyframes toastIn{from{transform:translateY(-20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@keyframes toastOut{to{transform:translateY(-20px);opacity:0;}}

/* ============================================================
   底部状态栏
   ============================================================ */
.bottombar{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:var(--mario-brown);
  border-top:4px solid #1f1810;
  padding:11px 20px;
  display:flex;align-items:center;justify-content:space-between;
  font-size:10px;font-weight:900;letter-spacing:0.1em;
  color:var(--mario-cream);text-transform:uppercase;
}
.bottombar .left{display:flex;align-items:center;gap:8px;}
.bottombar .right{display:flex;align-items:center;gap:8px;}
.bottombar .live{display:inline-block;width:8px;height:8px;background:var(--mario-green);border-radius:50%;animation:liveBlink 1.4s ease-in-out infinite;}
@keyframes liveBlink{0%,100%{opacity:1;}50%{opacity:0.3;}}

/* ============================================================
   响应式
   ============================================================ */
@media (min-width:640px){
  .content{max-width:680px;margin:0 auto;}
  .balance-wrap,.topbar,.tabs,.bottombar{max-width:720px;margin-left:auto;margin-right:auto;}
  .topbar{border-left:var(--border);border-right:var(--border);}
  .tabs{border-left:var(--border);border-right:var(--border);}
  .bottombar{border-left:var(--border);border-right:var(--border);}
  .reward-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));}
}
@media (max-width:380px){
  .balance-num .num{font-size:58px;}
  .reward-grid{grid-template-columns:repeat(2,1fr);}
}


/* ============================================================
   v1.3.0 追加 · 趣味动效 + 移动端增强
   （纯新增规则，不改动上方任何既有样式）
   ============================================================ */

/* 得分飞行数字：从被点的任务位置飘起并淡出 */
.fly-score{
  position:fixed; transform:translate(-50%,-50%);
  font-family:var(--pixel-font); font-size:22px; font-weight:900;
  pointer-events:none; z-index:300; white-space:nowrap;
  text-shadow:2px 2px 0 var(--mario-brown), -2px 2px 0 var(--mario-brown),
              2px -2px 0 var(--mario-brown), -2px -2px 0 var(--mario-brown),
              0 4px 10px rgba(0,0,0,.25);
  animation:flyScoreUp .9s cubic-bezier(.2,.8,.3,1) forwards;
}
.fly-score.in {color:var(--mario-yellow);}
.fly-score.out{color:var(--mario-red);}
@keyframes flyScoreUp{
  0%  {opacity:0; transform:translate(-50%,-50%) scale(.6);}
  22% {opacity:1; transform:translate(-50%,-75%) scale(1.25);}
  100%{opacity:0; transform:translate(-50%,-170%) scale(1);}
}

/* 抖动：animationend 自动复位，替代 setTimeout 链（连点时不会状态打架） */
.is-shaking{animation:shakeX .32s ease-in-out;}
@keyframes shakeX{
  0%,100%{transform:translateX(0);}
  25%    {transform:translateX(-6px);}
  50%    {transform:translateX(6px);}
  75%    {transform:translateX(-4px);}
}

/* 横屏字号不突变 */
html{-webkit-text-size-adjust:100%;}

/* 移动端：下拉不触发浏览器刷新手势，避免误操作 */
body{overscroll-behavior-y:contain;}

/* 刘海屏 / Home 条安全区：用 margin 外撑，不覆盖既有 padding */
@supports (margin: env(safe-area-inset-bottom)){
  :root{--safe-top:env(safe-area-inset-top); --safe-bottom:env(safe-area-inset-bottom);}
  .topbar   {margin-top:var(--safe-top);}
  .bottombar{margin-bottom:var(--safe-bottom);}
}

/* 触屏：主交互目标不小于 44px */
@media (hover:none){
  .tab, .view-btn, .btn{min-height:44px;}
}

/* 尊重系统「减少动态效果」设置 */
@media (prefers-reduced-motion:reduce){
  .fly-score, .is-shaking, .particle{animation-duration:.01ms !important;}
}

/* 隐藏 Tab 导航的滚动条（移动端） */
.tabs::-webkit-scrollbar{display:none;}
.tabs{scrollbar-width:none;-ms-overflow-style:none;}
</style>

  {id:'r_cs', emoji:'🔫', name:'真人CS一次', cost:200, cat:'big'},
  {id:'r_badm', emoji:'🏸', name:'进阶款羽毛球拍', cost:300, cat:'big'},
  {id:'r_special', emoji:'✨', name:'特别礼物', cost:1000, cat:'big', note:'需家长同意'},
];

// ----- 默认快捷任务（首页显示） -----
const QUICK_IDS = ['t_dawn','t_home','t_eng_p','t_read','t_fit_full'];

// ---------- ② 状态存取 ----------
const STORAGE_KEY = 'max_credits_v12';   // 沿用 v1.2 键名，升级不丢数据

const defaultState = () => ({
  balance: 0,
  records: [],            // {time, type:'in'|'out', val, name, taskId?}
  doneToday: {},          // {taskId:'YYYY-MM-DD'} 当日已完成；跨天自动失效
  monthIn: 0,             // 本月入账（不含余额结转）
  monthOut: 0,
  totalIn: 0,
  totalOut: 0,
  cfg: {expireRate: 10, initBal: 0, expireOn: true},
  view: 'max',            // 'max' | 'parent'
  lastResetMonth: null,   // 'YYYY-MM'，防重复执行月过期
});

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? Object.assign(defaultState(), JSON.parse(raw)) : defaultState();
  }catch(e){
    console.warn('[MAX] 存档读取失败，已回退初始状态', e);
    return defaultState();
  }
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    // 隐私模式 / 配额满：宁可报错，也不能让用户以为数据已存下
    toast('⚠️ 保存失败：浏览器存储不可用', 'error');
    console.error('[MAX] saveState 失败', e);
  }
}

// ---------- ③ 工具函数 ----------
const $ = id => document.getElementById(id);
const pad2 = n => String(n).padStart(2, '0');
const now = () => new Date();

// 导入的 JSON 会经 innerHTML 渲染，必须转义
const ESC_MAP = {'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'};
const esc = s => String(s).replace(/[&<>"']/g, c => ESC_MAP[c]);

const dayStr   = (d = now()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const monthStr = (d = now()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
const clockStr = (d = now()) => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
const recordTimeStr = ms => {const t = new Date(ms); return `${t.getMonth() + 1}/${t.getDate()} ${clockStr(t)}`;};

const daysInMonth     = () => new Date(now().getFullYear(), now().getMonth() + 1, 0).getDate();
const daysLeftInMonth = () => daysInMonth() - now().getDate();
const pendingExpire   = () => state.cfg.expireOn ? Math.floor(state.balance * state.cfg.expireRate / 100) : 0;
const isDoneToday     = id => state.doneToday[id] === dayStr();
const signed          = n => (n >= 0 ? '+' : '') + n;

// ---------- ④ 核心业务 ----------

// 唯一改余额入口：保证 balance / records / 月度累计三处同步落盘
function addRecord(type, val, name, taskId){
  state.balance += val;
  state.records.unshift({time: Date.now(), type, val, name, taskId});
  if(type === 'in'){
    state.monthIn += val;
    state.totalIn += val;
  }else{
    state.monthOut += Math.abs(val);
    state.totalOut += Math.abs(val);
  }
  saveState();
}

// 跨月按比例回收上月余额。
// 仅当「已知上月月份」时才扣——首次运行（lastResetMonth 为 null）只记录月份，
// 否则首次打开就会白扣一次 10%。
function checkMonthlyExpire(){
  const thisMonth = monthStr();
  if(state.lastResetMonth === thisMonth) return;

  const monthChanged = state.lastResetMonth !== null;
  if(monthChanged && state.cfg.expireOn && state.balance > 0){
    const expire = Math.floor(state.balance * state.cfg.expireRate / 100);
    if(expire > 0){
      state.balance -= expire;
      state.monthOut += expire;
      state.totalOut += expire;
      state.records.unshift({time: Date.now(), type:'out', val:-expire, name:`⏰ 月度过期 -${state.cfg.expireRate}%`});
      toast(`📅 新月已回收 ${expire}C（-${state.cfg.expireRate}%）`, 'error');
    }
  }
  state.monthIn = 0;
  state.monthOut = 0;
  state.lastResetMonth = thisMonth;
  saveState();
}

// 连击：15 秒内连续完成计为连击，只影响粒子数量与提示文案
const COMBO_WINDOW_MS = 15000;
let comboCount = 0, comboAt = 0;
function bumpCombo(){
  const t = Date.now();
  comboCount = (t - comboAt < COMBO_WINDOW_MS) ? comboCount + 1 : 1;
  comboAt = t;
  return comboCount;
}

// 里程碑：只在「跨过」阈值那一刻庆祝一次
const MILESTONES = [100, 300, 500, 1000, 2000];
function checkMilestone(before, after){
  for(const m of MILESTONES){
    if(before < m && after >= m){
      giftPop('🏆');
      toast(`🏆 达成 ${m} C！太强了！`, 'success');
      return;
    }
  }
}

function completeTask(task, sourceEl){
  // 作弊/撒谎：按当次积分 ×3 扣除，基数由家长输入
  if(task.id === 't_cheat'){
    showModal({
      emoji:'🤨',
      title:'作弊/撒谎处理',
      sub:'将按当次任务积分 × 3 扣除。请输入当次积分：',
      input:{value:5, min:1, max:100},
      actions:[
        {label:'取消'},
        {label:'确认扣除', cls:'danger', onClick:v => {
          const penalty = (parseInt(v, 10) || 0) * 3;
          addRecord('out', -penalty, `🚫 作弊撒谎 -${penalty}`, task.id);
          state.doneToday[task.id] = dayStr();
          saveState();                      // addRecord 已落盘，这里补落 doneToday
          burst(); render();
          toast(`已扣除 ${penalty}C`, 'error');
          closeModal();
        }},
      ],
    });
    return;
  }

  const before = state.balance;
  addRecord(task.val >= 0 ? 'in' : 'out', task.val,
            `${task.emoji} ${task.text} ${signed(task.val)}`, task.id);
  state.doneToday[task.id] = dayStr();
  saveState();   // v1.2 漏了这步 → 刷新后当天任务可重复点、无限刷分

  const combo = bumpCombo();
  flyScore(sourceEl, `${signed(task.val)}C`, task.val >= 0);
  if(task.val >= 0) burst(12 + Math.min(combo, 5) * 4);
  render();

  const comboTip = combo >= 2 ? `　🔥 ${combo} 连击!` : '';
  toast(`${signed(task.val)} C · ${task.text}${comboTip}`, task.val > 0 ? 'success' : 'error');
  checkMilestone(before, state.balance);
}

function redeemReward(r){
  if(state.balance < r.cost){
    toast(`余额不足！还差 ${r.cost - state.balance}C`, 'error');
    shake($('balNum'));
    return;
  }
  showModal({
    emoji:r.emoji,
    title:`兑换 ${r.name}?`,
    sub:`需要 <b style="color:var(--primary)">${r.cost} C</b>，当前余额 <b>${state.balance} C</b>。${r.note ? '<br><br>' + esc(r.note) : ''}`,
    actions:[
      {label:'再想想'},
      {label:`确认兑换 -${r.cost}C`, cls:'primary', onClick:() => {
        addRecord('out', -r.cost, `${r.emoji} 兑换 ${r.name} -${r.cost}`, r.id);
        giftPop(r.emoji);
        render();
        toast(`🎉 成功兑换 ${r.name}!`, 'success');
        closeModal();
      }},
    ],
  });
}

// ---------- ⑤ 渲染层（只读 state，不改 state） ----------
function render(){
  const activeView = document.querySelector('.view.active');
  const viewScroll = activeView ? activeView.scrollTop : 0;
  const pageScroll = document.documentElement.scrollTop;

  renderBalance();
  renderHomeCards();
  renderTaskWall();
  renderShop();
  renderRecordList();
  if(state.view === 'parent') renderAdmin();

  if(activeView) activeView.scrollTop = viewScroll;
  document.documentElement.scrollTop = pageScroll;
}

function renderBalance(){
  const numEl = $('balNum');
  if(parseInt(numEl.textContent, 10) !== state.balance){
    numEl.classList.add('flip');
    setTimeout(() => numEl.classList.remove('flip'), 500);
  }
  numEl.textContent = state.balance;

  $('monthIn').textContent  = '+' + state.monthIn;
  $('monthOut').textContent = '-' + state.monthOut;

  const left = daysLeftInMonth(), total = daysInMonth();
  $('expireDays').textContent   = left + ' 天';
  $('expireFill').style.width   = ((total - left) / total * 100) + '%';
  $('expireSoon').textContent   = pendingExpire();

  $('taskCount').textContent = TASKS.length + ' 项';
  $('shopCount').textContent = REWARDS.length + ' 件';
}

function renderHomeCards(){
  const willExpire = pendingExpire();
  const left = daysLeftInMonth();
  const hints = [];

  if(state.balance === 0){
    hints.push('👋 欢迎使用 MAX\'s CREDITS！从「任务」开始赚你的第一笔 Credits 吧。');
  }else{
    hints.push(`💰 当前 <b style="color:var(--primary)">${state.balance} C</b>，月底将自动扣除 <b style="color:var(--danger)">${willExpire} C</b>。`);
  }
  if(left <= 5 && willExpire > 0){
    hints.push(`<br>⚠️ <b style="color:var(--danger)">还有 ${left} 天</b>就到月底了，未花掉的 Credits 会被回收哦！`);
  }else if(state.balance > 100 && willExpire >= 10){
    hints.push('<br>🎯 余额充足，去「商店」挑个心仪的奖励吧！');
  }
  $('todayHint').innerHTML = hints.join('');

  $('quickTasks').innerHTML = QUICK_IDS
    .map(id => TASKS.find(t => t.id === id))
    .filter(Boolean)
    .map(taskItemHTML).join('');

  const recent = state.records
    .filter(r => r.type === 'out' && (r.name.includes('兑换') || r.name.includes('过期')))
    .slice(0, 3);
  $('recentRedeem').innerHTML = recent.length
    ? recent.map(recordHTML).join('')
    : '<div class="empty">还没有兑换记录，去商店看看吧 →</div>';
}

const taskItemHTML = t => `
  <div class="task ${isDoneToday(t.id) ? 'done' : ''}" data-task="${t.id}">
    <div class="task-emoji">${t.emoji}</div>
    <div class="task-body">
      <div class="task-type">${t.type}</div>
      <div class="task-text">${t.text}${t.note ? `<br><span style="font-size:10px;color:var(--text-3);font-weight:700">· ${t.note}</span>` : ''}</div>
    </div>
    <div class="task-val ${t.val >= 0 ? 'pos' : 'neg'}">${signed(t.val)}</div>
  </div>`;

function renderTaskWall(){
  let html = '';
  for(const key in TASK_GROUPS){
    const items = TASKS.filter(t => t.group === key);
    if(!items.length) continue;
    html += `<div class="task-group-label">${TASK_GROUPS[key].label} · ${items.length}</div>`;
    html += `<div class="task-list">${items.map(taskItemHTML).join('')}</div>`;
  }
  $('allTasks').innerHTML = html;
}

function renderShop(){
  let html = '';
  for(const key in REWARD_CATS){
    const items = REWARDS.filter(r => r.cat === key);
    if(!items.length) continue;
    html += `<div class="reward-cat"><div class="reward-cat-label">${REWARD_CATS[key].label} · ${items.length}</div><div class="reward-grid">`;
    for(const r of items){
      const unaffordable = state.balance < r.cost;
      html += `
        <div class="reward ${unaffordable ? 'disabled' : ''}" data-reward="${r.id}">
          ${r.tag ? `<div class="reward-tag">${r.tag}</div>` : ''}
          <div class="reward-emoji">${r.emoji}</div>
          <div class="reward-name">${esc(r.name)}</div>
          <div class="reward-cost">${r.cost}<span class="c">C</span></div>
        </div>`;
    }
    html += '</div></div>';
  }
  $('shopBody').innerHTML = html;
}

function renderRecordList(){
  $('allRecords').innerHTML = state.records.length
    ? state.records.slice(0, 50).map(recordHTML).join('')
    : '<div class="empty">还没有任何记录</div>';
}

const recordHTML = r => `
  <div class="record">
    <div class="record-dot ${r.type}"></div>
    <div class="record-body">
      <div class="record-title">${esc(r.name)}</div>
      <div class="record-meta">${recordTimeStr(r.time)}</div>
    </div>
    <div class="record-val ${r.type}">${signed(r.val)}</div>
  </div>`;

// 控制台数字 + 表单回填（v1.2 表单写死 value=10，导入数据后显示是错的）
function renderAdmin(){
  $('adBal').textContent      = state.balance;
  $('adIn').textContent       = '+' + state.monthIn;
  $('adOut').textContent      = '-' + state.monthOut;
  $('adExpire').textContent   = '-' + pendingExpire();
  $('adTotalIn').textContent  = state.totalIn;
  $('adTotalOut').textContent = state.totalOut;

  $('cfgExpire').value = state.cfg.expireRate;
  $('cfgInit').value   = state.cfg.initBal;
  $('cfgExpireOn').classList.toggle('on', state.cfg.expireOn);
}

// ---------- ⑥ 交互绑定 ----------

// 只切页面，不改 state
function showView(name){
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.dataset.view === name));
}

// 切视角（MAX / 爸妈），会落盘并重渲染
function setViewMode(mode){
  state.view = mode;
  document.querySelectorAll('#viewToggle .view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === mode));
  if(mode === 'parent'){
    document.querySelectorAll('#tabs .tab').forEach(x => x.classList.remove('active'));
    showView('admin');
  }else{
    const homeTab = document.querySelector('#tabs .tab[data-tab="home"]');
    if(homeTab) homeTab.classList.add('active');
    showView(document.querySelector('#tabs .tab.active')?.dataset.tab || 'home');
  }
  saveState();
  render();
}

document.querySelectorAll('#tabs .tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('#tabs .tab').forEach(x => x.classList.remove('active'));
    tab.classList.add('active');
    // 爸妈视角下点 Tab = 退出控制台回到 MAX 视角
    // （v1.2 这里是空 if，导致「顶栏停在爸妈、页面却在首页」的状态错位）
    if(state.view === 'parent') setViewMode('max');
    else showView(tab.dataset.tab);
  });
});

document.querySelectorAll('#viewToggle .view-btn').forEach(btn => {
  btn.addEventListener('click', () => setViewMode(btn.dataset.view));
});

// 事件委托：任务/奖励都是动态渲染的，绑一次 document 即可
document.addEventListener('click', e => {
  const taskEl = e.target.closest('.task');
  if(taskEl){
    if(taskEl.classList.contains('done')) return;
    const t = TASKS.find(x => x.id === taskEl.dataset.task);
    if(t) completeTask(t, taskEl);
    return;
  }
  const rewardEl = e.target.closest('.reward');
  if(rewardEl && !rewardEl.classList.contains('disabled')){
    const r = REWARDS.find(x => x.id === rewardEl.dataset.reward);
    if(r) redeemReward(r);
  }
});

// 轻量确认框：actions 每项 {label, cls, onClick(value)}
function showModal({emoji, title, sub, actions = [], input}){
  const parts = [];
  if(emoji) parts.push(`<div class="confirm-emoji">${emoji}</div>`);
  parts.push(`<div class="modal-title">${title}</div>`);
  if(sub)   parts.push(`<div class="modal-sub">${sub}</div>`);
  if(input) parts.push(`<div style="margin-top:8px"><input type="number" class="setting-input" id="modalInput" value="${input.value ?? 0}" min="${input.min ?? 0}" max="${input.max ?? 9999}" style="width:100%;font-size:18px;padding:12px"></div>`);
  if(actions.length){
    parts.push('<div class="modal-actions">' +
      actions.map((a, i) => `<button class="btn ${a.cls || ''}" data-act="${i}">${a.label}</button>`).join('') +
      '</div>');
  }
  $('modalContent').innerHTML = parts.join('');
  $('modal').classList.add('show');

  // 按索引绑定（v1.2 用 indexOf 反查，label 重复时会串台）
  $('modalContent').querySelectorAll('.modal-actions .btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = actions[parseInt(btn.dataset.act, 10)];
      action.onClick?.(input ? $('modalInput').value : null);
    });
  });
}

const closeModal = () => $('modal').classList.remove('show');
$('modal').addEventListener('click', e => {if(e.target.id === 'modal') closeModal();});

// --- 爸妈控制台 ---
$('cfgExpire').addEventListener('change', e => {
  state.cfg.expireRate = Math.max(0, Math.min(50, parseInt(e.target.value, 10) || 0));
  saveState(); render();
  toast(`过期比例已设为 ${state.cfg.expireRate}%`);
});

$('cfgInit').addEventListener('change', e => {
  state.cfg.initBal = Math.max(0, parseInt(e.target.value, 10) || 0);
  saveState();
});

$('cfgExpireOn').addEventListener('click', () => {
  state.cfg.expireOn = !state.cfg.expireOn;
  saveState(); render();
  toast(state.cfg.expireOn ? '过期机制已开启' : '过期机制已关闭');
});

$('btnAddBonus').addEventListener('click', () => {
  showModal({
    emoji:'🎁',
    title:'发放奖励积分',
    sub:'直接给 Max 发放一笔 Bonus C，不绑定任务。',
    input:{value:10, min:1, max:9999},
    actions:[
      {label:'取消'},
      {label:'发放', cls:'primary', onClick:v => {
        const n = parseInt(v, 10) || 0;
        if(n <= 0){
          toast('请输入大于 0 的积分', 'error');
          return;
        }
        addRecord('in', n, `🎁 爸妈奖励 +${n}`);
        burst(); render();
        toast(`已发放 ${n} C`, 'success');
        closeModal();
      }},

  });
});

$('btnExport').addEventListener('click', () => {
  const url = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], {type:'application/json'}));
  const a = document.createElement('a');
  a.href = url;
  a.download = `max-credits-${dayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('已导出数据', 'success');
});

$('btnImport').addEventListener('click', () => $('fileInput').click());

$('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      state = Object.assign(defaultState(), JSON.parse(ev.target.result));
      saveState(); render();
      toast('已导入数据', 'success');
    }catch(err){
      toast('导入失败：JSON 格式错误', 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = '';   // 清空，允许连续导入同一个文件
});

$('btnReset').addEventListener('click', () => {
  showModal({
    emoji:'⚠️',
    title:'重置全部数据？',
    sub:'将清空余额、记录、设置，且不可恢复。建议先「导出数据」备份。',
    actions:[
      {label:'取消'},
      {label:'确认重置', cls:'danger', onClick:() => {
        // 沿用当前「起步余额」设置（v1.2 直接归零，该设置形同虚设）
        state = Object.assign(defaultState(), {balance: state.cfg.initBal});
        saveState(); render();
        toast('已重置', 'error');
        closeModal();
      }},
    ],
  });
});

// ---------- ⑦ 动效层 ----------
const PARTICLE_COLORS = ['#FF4D2E', '#FFD60A', '#06D6A0', '#3A86FF', '#9D4EDD', '#FF006E'];

function spawnParticle(layer, css, lifeMs, text){
  const p = document.createElement('div');
  p.className = 'particle';
  if(text) p.textContent = text;
  p.style.cssText = css;
  layer.appendChild(p);
  setTimeout(() => p.remove(), lifeMs);
}

// 放射彩带
function burst(count = 12){
  const layer = $('particleLayer');
  const cx = window.innerWidth / 2, cy = 200;
  for(let i = 0; i < count; i++){
    const angle = (i / count) * Math.PI * 2;
    const dist = 80 + Math.random() * 80;
    const size = 6 + Math.random() * 8;
    spawnParticle(layer, `
      left:${cx}px;top:${cy}px;
      background:${PARTICLE_COLORS[i % PARTICLE_COLORS.length]};
      --dx:${Math.cos(angle) * dist}px;--dy:${Math.sin(angle) * dist}px;
      width:${size}px;height:${size}px;`, 1200);
  }
}

// 兑换成功：emoji 从屏幕中心炸开
function giftPop(emoji){
  const layer = $('particleLayer');
  const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
  for(let i = 0; i < 8; i++){
    const angle = (i / 8) * Math.PI * 2;
    const dist = 100 + Math.random() * 60;
    spawnParticle(layer, `
      left:${cx}px;top:${cy}px;background:transparent;font-size:24px;
      --dx:${Math.cos(angle) * dist}px;--dy:${Math.sin(angle) * dist - 40}px;`, 1500, emoji);
  }
}

// 得分飞行数字：从被点的任务位置飘起
function flyScore(fromEl, text, positive){
  if(!fromEl) return;
  const r = fromEl.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'fly-score ' + (positive ? 'in' : 'out');
  el.textContent = text;
  el.style.left = (r.left + r.width / 2) + 'px';
  el.style.top  = (r.top + r.height / 2) + 'px';
  $('particleLayer').appendChild(el);
  setTimeout(() => el.remove(), 900);
}

// 抖动：用 animation + animationend 复位，避免 setTimeout 链在连点时互相打架
function shake(el){
  if(!el) return;
  el.classList.remove('is-shaking');
  void el.offsetWidth;                 // 强制重排，使动画可重复触发
  el.classList.add('is-shaking');
  el.addEventListener('animationend', () => el.classList.remove('is-shaking'), {once:true});
}

function toast(msg, type = ''){
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  $('toastLayer').appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

// ---------- ⑧ 启动 ----------
setViewMode(state.view);   // 同步视角按钮 + 首屏
checkMonthlyExpire();
render();

// 调试入口：控制台可手动刷分排查
window.MAX = {
  get state(){return state;},   // 用 getter，重置后仍指向当前 state
  TASKS, REWARDS,
  doTask(id){const t = TASKS.find(x => x.id === id); t ? completeTask(t) : console.warn('task not found:', id);},
  doReward(id){const r = REWARDS.find(x => x.id === id); r ? redeemReward(r) : console.warn('reward not found:', id);},
  reset(){state = Object.assign(defaultState(), {balance: state.cfg.initBal}); saveState(); render();},
};

console.log('%c MAX\'s CREDITS v1.3.0 ', 'background:#FF4D2E;color:#000;font-size:14px;font-weight:900;padding:4px 12px');
console.log('存档键：', STORAGE_KEY, '｜调试：window.MAX.doTask("t_dawn") / doReward("r_cash") / reset()');

// 自检：打开 index.html?selftest 会在控制台打印核心规则校验结果
function runSelfTest(){
  const assert = (name, pass) => `${pass ? '✅' : '❌'} ${name}`;
  const results = [
    assert('任务 ID 无重复', new Set(TASKS.map(t => t.id)).size === TASKS.length),
    assert('奖励 ID 无重复', new Set(REWARDS.map(r => r.id)).size === REWARDS.length),
    assert('快捷任务 ID 均存在', QUICK_IDS.every(id => TASKS.some(t => t.id === id))),
    assert('任务分组均已定义', TASKS.every(t => TASK_GROUPS[t.group])),
    assert('奖励分类均已定义', REWARDS.every(r => REWARD_CATS[r.cat])),
    assert('正负号渲染', signed(5) === '+5' && signed(-3) === '-3'),
    assert('日期补零', dayStr(new Date(2026, 0, 5)) === '2026-01-05'),
    assert('HTML 转义', esc('<img src=x onerror=1>') === '&lt;img src=x onerror=1&gt;'),
  ];

  // 业务链路：改一笔账，验证余额/累计同步，再还原
  const snapshot = JSON.stringify(state);
  const before = state.balance, inBefore = state.totalIn;
  addRecord('in', 10, '自检临时记录');
  results.push(assert('入账同步更新余额与累计', state.balance === before + 10 && state.totalIn === inBefore + 10));
  state = JSON.parse(snapshot);
  saveState(); render();
  results.push(assert('还原后余额一致', state.balance === before));

  console.log('%c 自检结果 ', 'background:#43B047;color:#fff;font-weight:900;padding:4px 10px');
  console.log(results.join(' ｜ '));
}
if(location.search.includes('selftest')) runSelfTest();
